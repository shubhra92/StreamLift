[package]
name = "rust-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }

# Low-level HTTP for MEGA uploads (bypasses reqwest quirks)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Concurrent map for progress store
dashmap = "6"

# Env / config
dotenvy = "0.15"

# Crypto (for MEGA)
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"

# Encoding
base64 = "0.22"
hex = "0.4"

# Futures / streams
futures = "0.3"
bytes = "1"
async-stream = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Misc
rand = "0.8"
num-bigint = "0.4"
url = "2"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
